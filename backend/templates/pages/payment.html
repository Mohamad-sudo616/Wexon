{% extends "base.html" %}

{% block title %}Payment | Wexon Shop{% endblock %}

{% block content %}

<h1>Payment</h1>

<h2>Order #{{ order.id }}</h2>

<p>
    Amount:
    <strong>{{ payment.amount }}</strong>
</p>

<p>
    This is a temporary payment page for development.
</p>

<form method="post" action="{% url 'payments:process_payment' order.id %}">
    {% csrf_token %}

    <button type="submit">
        Complete Test Payment
    </button>
</form>

{% endblock %}
